<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contínuo — planejador de curso BCC/ICMC</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/curriculum.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="barra">
  <div class="marca">
    <span class="marca-nome">contínuo</span>
    <span class="marca-sub" id="marca-curso">Bacharelado em Ciências de Computação · ICMC/USP</span>
  </div>
  <div class="barra-acoes">
    <label class="alternar" hidden id="box-paridade">
      <input type="checkbox" id="chk-paridade" checked>
      <span>Só disciplinas do semestre certo</span>
    </label>
    <label class="alternar" hidden id="box-limite">
      <input type="checkbox" id="chk-limite" checked>
      <span>Limite de 20 créditos</span>
    </label>
    <button class="btn btn-fantasma" id="btn-recomecar" hidden>Começar de novo</button>
    <button class="btn btn-primario" id="btn-pdf" hidden>Baixar plano em PDF</button>
  </div>
</header>

<!-- ENTRADA ---------------------------------------------------------------- -->
<main class="entrada" id="tela-entrada">
  <div class="entrada-texto">
    <h1>Planeje o que falta para se formar.</h1>
    <p class="lede">Carregue o histórico do Júpiter e monte os próximos semestres.<br>Nada sai do seu navegador.</p>
  </div>

  <div class="zona" id="zona">
    <input type="file" id="arquivo" accept="application/pdf" hidden>
    <div class="zona-corpo">
      <span class="zona-icone" aria-hidden="true">PDF</span>
      <p class="zona-chamada">Arraste o histórico ou <button class="link" id="btn-escolher">escolha o arquivo</button></p>
      <p class="zona-nota">Júpiter → Histórico Escolar → PDF completo</p>
      <p class="zona-erro" id="zona-erro" role="alert" hidden></p>
    </div>
  </div>
</main>

<!-- PLANEJADOR ------------------------------------------------------------- -->
<div class="app" id="tela-app" hidden>

  <aside class="rail">
    <div class="rail-topo">
      <h2 class="rail-titulo">A cursar</h2>
      <p class="rail-sub" id="rail-resumo"></p>
      <input type="search" id="busca" class="busca" placeholder="Buscar sigla ou nome" autocomplete="off">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por instituto"></div>
      <p class="enfases-titulo">Ênfase</p>
      <div class="filtros" id="enfases" role="group" aria-label="Escolher ênfase"></div>
    </div>
    <div class="rail-listas" id="listas"></div>
  </aside>

  <section class="board" id="board" aria-label="Semestres planejados"></section>

  <footer class="placar" id="placar">
    <div class="medidores" id="medidores"></div>
    <div class="placar-fim">
      <p class="placar-estado" id="placar-estado"></p>
    </div>
  </footer>
</div>

<div class="carregando" id="carregando" hidden><span></span>Lendo histórico…</div>

<script type="module" src="assets/app.js"></script>
<script type="module" src="assets/pdf.js"></script>
</body>
</html>
